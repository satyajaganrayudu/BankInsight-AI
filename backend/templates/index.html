<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BankInsight AI</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <div class="app">

        <header class="topbar">

            <div class="brand">

                <div class="brand-icon">
                    🏦
                </div>

                <div>
                    <h1>BankInsight AI</h1>
                    <p>Financial Report Intelligence</p>
                </div>

            </div>

        </header>


        <main class="chat-container">

            <div
                id="chat"
                class="chat"
            >

                <div class="welcome">

                    <div class="welcome-icon">
                        🏦
                    </div>

                    <h2>
                        Welcome to BankInsight AI
                    </h2>

                    <p>
                        Ask questions about your financial reports.
                    </p>

                    <div class="examples">

                        <button onclick="askExample(this)">
                            What was the standalone net profit?
                        </button>

                        <button onclick="askExample(this)">
                            What was the total income?
                        </button>

                        <button onclick="askExample(this)">
                            What was the capital adequacy ratio?
                        </button>

                    </div>

                </div>

            </div>


            <div class="input-area">

                <div class="input-box">

                    <textarea
                        id="question"
                        placeholder="Ask something about the financial report..."
                        rows="1"
                    ></textarea>

                    <button
                        id="sendButton"
                        onclick="sendQuestion()"
                    >
                        ➤
                    </button>

                </div>

                <p class="disclaimer">
                    BankInsight AI answers using the uploaded financial report.
                </p>

            </div>

        </main>

    </div>


    <script
        src="{{ url_for('static', filename='js/app.js') }}"
    ></script>

</body>

</html>
